about:
  - Marine veteran and Senior Field Engineer who keeps mission-critical training systems secure and running, now bringing that operational discipline to DevOps, DevSecOps, and cloud engineering.
  - Since 2022, I’ve supported F-35 flight simulators for Lockheed Martin. I manage Linux servers, virtual machines, and Active Directory in environments where downtime and security gaps aren’t an option. Before that, I provided Tier 1 support on the NGEN contract. I also spent five years in the U.S. Marine Corps as a field radio operator, keeping communications up when it mattered.
  - I have graduated with a B.S. in Software Engineering at Western Governors University and write code in Go, Python, Java/Kotlin, and SQL. I’m also building infrastructure-as-code skills and preparing for the HashiCorp Terraform Associate certification.
  - "Clearance: Secret"
  - I’m relocating to Boise, Idaho, and I’m open to DevOps, DevSecOps, Cloud, and Software Engineering roles in Boise or remote. Let’s connect.

