<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}" data-site-url="{{ site.url }}" data-github="{{ site.social.github }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0c0d">
  <script>document.documentElement.classList.add('js')</script>
{% include seo.html %}
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Saira:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</head>
<body class="page--{{ page.body_class | default: page.layout | default: 'page' }}">
  <div class="space" aria-hidden="true">
    <div class="space__planet"></div>
    <div class="space__stars"></div>
    <div class="space__stars space__stars--far"></div>
    <div class="space__grid"></div>
  </div>
{% include header.html %}
  <main id="main" class="site-main">
{{ content }}
  </main>
{% include footer.html %}
</body>
</html>
